name: GitHub Project → Trello
run-name: >-
  Project → Trello • ${{
    github.event_name == 'workflow_dispatch' && 'Manual synchronization' ||
    github.event_name == 'schedule' && 'Scheduled synchronization' ||
    'Update synchronization'
  }}

on:
  # This checked-in workflow uses update-driven mode. Do not add `schedule`;
  # replace `issues` as documented if changing to interval mode.
  issues:
    types:
      - opened
      - edited
      - deleted
      - transferred
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
  workflow_dispatch:
  workflow_call:
    secrets:
      TRELLO_API_KEY: { required: true }
      TRELLO_API_TOKEN: { required: true }
      TRELLO_BOARD_ID: { required: true }
      TRELLO_TODO_LIST_ID: { required: true }
      TRELLO_DONE_LIST_ID: { required: true }
      TRELLO_INPROGRESS_LIST_ID: { required: true }
      TRELLO_MEMBER_MAP: { required: true }
      PROJECT_TOKEN: { required: true }
      GH_PROJECT_OWNER: { required: true }
      GH_PROJECT_NUMBER: { required: true }

permissions:
  contents: read

concurrency:
  group: trello-reconciliation
  cancel-in-progress: false

jobs:
  sync:
    name: Reconcile project statuses and cards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create, update, and move Trello cards
        uses: rajipkanxo01/Trello-Github-Sync@main
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_TODO_LIST_ID: ${{ secrets.TRELLO_TODO_LIST_ID }}
          TRELLO_DONE_LIST_ID: ${{ secrets.TRELLO_DONE_LIST_ID }}
          TRELLO_INPROGRESS_LIST_ID: ${{ secrets.TRELLO_INPROGRESS_LIST_ID }}
          TRELLO_MEMBER_MAP: ${{ secrets.TRELLO_MEMBER_MAP }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_PROJECT_OWNER: ${{ secrets.GH_PROJECT_OWNER }}
          GH_PROJECT_NUMBER: ${{ secrets.GH_PROJECT_NUMBER }}
